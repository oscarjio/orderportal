name: Bygg Windows-exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Bygg installer + portabel exe
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: OrderPortal-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publicera release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
